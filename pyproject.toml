[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinelflow-ids"
version = "0.2.0"
description = "An explainable, reproducible network intrusion detection research platform."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bilal Anwar" }]
keywords = ["intrusion-detection", "cybersecurity", "anomaly-detection", "network-security", "machine-learning"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Information Technology", "Topic :: Security", "Programming Language :: Python :: 3"]
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<4", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.10,<2", "bandit>=1.7,<2"]

[project.scripts]
sentinelflow = "sentinelflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
